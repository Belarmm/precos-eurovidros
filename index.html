<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1b2d">
<title>Comparativo de Preços — Eurovidros</title>
<style>
:root {
  --bg: #0f1b2d;
  --bg2: #162235;
  --bg3: #1e2f45;
  --border: #2a3f5a;
  --text: #e8f0fe;
  --text2: #8faac8;
  --accent: #1a8fe3;
  --accent2: #0bd48c;
  --gold: #f5a623;
  --red: #e84040;
  --purple: #9b59b6;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; min-height: 100vh; }

/* HEADER */
header {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
}
.logo-icon { font-size: 24px; }
.header-title { flex: 1; }
.header-title h1 { font-size: 16px; font-weight: 700; color: var(--accent); }
.header-title p { font-size: 11px; color: var(--text2); margin-top: 1px; }
.badge-mes {
  background: var(--accent); color: #fff;
  font-size: 10px; font-weight: 700;
  padding: 3px 8px; border-radius: 20px;
  letter-spacing: 0.5px; white-space: nowrap;
}

/* MAIN */
main { padding: 16px; max-width: 500px; margin: 0 auto; padding-bottom: 40px; }

.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 16px;
}
.card-label {
  font-size: 11px; font-weight: 700; letter-spacing: 1px;
  color: var(--text2); text-transform: uppercase; margin-bottom: 10px;
}

/* PRODUTO PICKER BUTTON */
.picker-btn {
  width: 100%;
  background: var(--bg3);
  color: var(--text2);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 14px 44px 14px 14px;
  font-size: 15px;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  position: relative;
  transition: border-color 0.2s;
  display: flex; align-items: center; justify-content: space-between;
  min-height: 50px;
}
.picker-btn.active { color: var(--text); border-color: var(--accent); }
.picker-btn.categoria-ativa { border-color: var(--accent2); }
.picker-btn .arrow { color: var(--accent); font-size: 18px; flex-shrink: 0; margin-left: 8px; }
.picker-btn .nome { flex: 1; font-size: 14px; line-height: 1.3; }
.picker-btn .mode-tag {
  font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
  background: rgba(11,212,140,0.15); color: var(--accent2);
  padding: 2px 7px; border-radius: 5px; margin-right: 6px; flex-shrink: 0;
}

/* MODAL */
.modal-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.7);
}
.modal-overlay.open { display: flex; flex-direction: column; justify-content: flex-end; }
.modal-sheet {
  background: var(--bg2);
  border-radius: 20px 20px 0 0;
  max-height: 85vh;
  display: flex; flex-direction: column;
  overflow: hidden;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-handle {
  width: 40px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 12px auto 0;
  flex-shrink: 0;
}
.modal-title {
  font-size: 14px; font-weight: 700;
  color: var(--text2); text-transform: uppercase; letter-spacing: 1px;
  padding: 12px 16px 8px;
  flex-shrink: 0;
}
.modal-search {
  margin: 0 16px 10px;
  background: var(--bg3);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 15px; font-family: inherit;
  color: var(--text);
  outline: none;
  flex-shrink: 0;
}
.modal-search:focus { border-color: var(--accent); }
.modal-list {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  flex: 1;
  padding: 0 8px 20px;
}

/* Seção de categorias no modal */
.modal-section-hdr {
  padding: 6px 12px 4px;
  font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--text2);
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}
.modal-category-item {
  padding: 13px 12px;
  font-size: 14px; font-weight: 700;
  color: var(--accent2);
  border-radius: 8px;
  cursor: pointer;
  border-bottom: 1px solid rgba(42,63,90,0.4);
  transition: background 0.1s;
  display: flex; align-items: center; gap: 10px;
}
.modal-category-item:last-of-type { border-bottom: none; }
.modal-category-item:active { background: var(--bg3); }
.modal-category-item.selected { background: rgba(11,212,140,0.08); }
.cat-icon { font-size: 18px; flex-shrink: 0; }
.cat-info { flex: 1; }
.cat-name { font-size: 14px; font-weight: 700; color: var(--accent2); line-height: 1.2; }
.cat-sub { font-size: 11px; color: var(--text2); font-weight: 400; margin-top: 1px; }
.cat-arrow { font-size: 14px; color: var(--text2); }

.modal-divider {
  border: none; border-top: 1px solid var(--border);
  margin: 8px 4px;
}
.modal-item {
  padding: 14px 12px;
  font-size: 14px;
  color: var(--text);
  border-radius: 8px;
  cursor: pointer;
  border-bottom: 1px solid rgba(42,63,90,0.5);
  transition: background 0.1s;
  line-height: 1.4;
}
.modal-item:last-child { border-bottom: none; }
.modal-item:active { background: var(--bg3); }
.modal-item.selected { color: var(--accent); font-weight: 700; }

/* CHIPS */
.chips-grid {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px;
}
.chip {
  background: var(--bg3);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 14px; font-weight: 600;
  color: var(--text2);
  cursor: pointer;
  user-select: none;
  min-width: 56px; text-align: center;
  transition: all 0.15s;
}
.chip:active { transform: scale(0.95); }
.chip.selected {
  background: var(--accent); border-color: var(--accent);
  color: #fff;
  box-shadow: 0 2px 10px rgba(26,143,227,0.4);
}

/* MARKUP CARD */
.markup-controls {
  display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
}
.markup-label { font-size: 13px; color: var(--text2); flex: 1; }
.markup-stepper {
  display: flex; align-items: center; gap: 8px;
}
.markup-btn {
  width: 34px; height: 34px;
  background: var(--bg3); border: 1.5px solid var(--border);
  border-radius: 8px; color: var(--accent);
  font-size: 20px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; user-select: none; flex-shrink: 0;
}
.markup-btn:active { background: var(--border); transform: scale(0.92); }
.markup-val {
  min-width: 54px; text-align: center;
  font-size: 22px; font-weight: 700; color: var(--text);
  background: var(--bg3); border: 1.5px solid var(--accent);
  border-radius: 8px; padding: 4px 6px;
}
.markup-pct { font-size: 16px; color: var(--text2); font-weight: 600; }
.markup-slider {
  width: 100%; margin: 4px 0 10px;
  -webkit-appearance: none; appearance: none;
  height: 4px; border-radius: 2px;
  background: var(--border); outline: none;
  cursor: pointer;
}
.markup-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px rgba(26,143,227,0.5);
  cursor: pointer;
}
.markup-quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.markup-quick-btn {
  background: var(--bg3); border: 1.5px solid var(--border);
  border-radius: 6px; padding: 5px 10px;
  font-size: 12px; font-weight: 700; color: var(--text2);
  cursor: pointer; transition: all 0.15s; user-select: none;
}
.markup-quick-btn:active { transform: scale(0.93); }
.markup-quick-btn.active {
  background: rgba(26,143,227,0.2); border-color: var(--accent);
  color: var(--accent);
}
.markup-formula {
  font-size: 12px; color: var(--text2);
  background: var(--bg3); border-radius: 8px;
  padding: 8px 12px; line-height: 1.5;
}
.markup-formula strong { color: var(--accent); }

/* BTN */
.btn-consultar {
  width: 100%;
  background: var(--accent); color: #fff;
  border: none; border-radius: 12px;
  padding: 16px; font-size: 16px; font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  margin-top: 4px;
}
.btn-consultar:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-consultar:not(:disabled):active { transform: scale(0.98); opacity: 0.85; }

/* RESULTADOS */
#resultado { margin-top: 4px; }
.resultado-header {
  font-size: 13px; color: var(--text2);
  margin-bottom: 12px; padding: 0 2px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.resultado-header strong { color: var(--accent2); }
.resultado-header .modo-tag {
  background: rgba(11,212,140,0.12); color: var(--accent2);
  font-size: 10px; font-weight: 700; padding: 2px 7px;
  border-radius: 5px; letter-spacing: 0.5px;
}

.fornecedor-card {
  background: var(--bg2);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px;
  position: relative;
}
.fornecedor-card.melhor {
  border-color: var(--accent2);
  box-shadow: 0 0 0 1px var(--accent2), 0 4px 20px rgba(11,212,140,0.1);
}
.badge-melhor {
  position: absolute; top: -1px; right: 12px;
  background: var(--accent2); color: #0a1a12;
  font-size: 10px; font-weight: 800;
  padding: 3px 10px; border-radius: 0 0 8px 8px;
  letter-spacing: 0.5px; text-transform: uppercase;
}

/* Header do card em modo categoria */
.fornec-header-cat {
  display: flex; align-items: flex-start; gap: 8px;
  margin-bottom: 12px; padding-right: 80px;
}
.fornec-produto-nome {
  font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.3; flex: 1;
}
.fornec-badge {
  background: rgba(26,143,227,0.12); color: var(--accent);
  font-size: 10px; font-weight: 700; padding: 2px 8px;
  border-radius: 5px; letter-spacing: 0.5px; flex-shrink: 0; margin-top: 1px;
}
/* Header do card em modo individual (original) */
.fornec-nome { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 12px; padding-right: 80px; }

.fornec-grade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fornec-item { background: var(--bg3); border-radius: 8px; padding: 10px 12px; }
.fornec-item.full { grid-column: 1 / -1; }
.fornec-item-label { font-size: 10px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }
.fornec-item-val { font-size: 17px; font-weight: 700; color: var(--text); }
.fornec-item-val.destaque { color: var(--accent2); font-size: 19px; }
.fornec-item-val.destaque-gold { color: var(--gold); }
.ipi-tag { display: inline-block; background: rgba(245,166,35,0.15); color: var(--gold); font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px; margin-left: 6px; }
.divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.resumo-box { background: var(--bg3); border-radius: 10px; padding: 14px; margin-top: 4px; }
.resumo-label { font-size: 11px; color: var(--text2); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.resumo-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.resumo-row:last-child { border-bottom: none; }
.resumo-row span:first-child { color: var(--text2); }
.resumo-row span:last-child { font-weight: 700; color: var(--text); }

footer { text-align: center; padding: 20px 16px 32px; font-size: 11px; color: var(--text2); }
</style>
</head>
<body>

<header>
  <div class="logo-icon">🪟</div>
  <div class="header-title">
    <h1>Comparativo de Preços</h1>
    <p>Eurovidros — 4 fornecedores · 49 produtos</p>
  </div>
  <div class="badge-mes">MAR/26</div>
</header>

<main>
  <!-- CARD 1: PRODUTO -->
  <div class="card">
    <div class="card-label">1. Produto</div>
    <button class="picker-btn" id="btnProduto" onclick="abrirModal()">
      <span class="nome" id="nomeProduto">Toque para selecionar...</span>
      <span class="arrow">▾</span>
    </button>
  </div>

  <!-- CARD 2: ESPESSURA -->
  <div class="card" id="cardEspessura" style="display:none">
    <div class="card-label">2. Espessura</div>
    <div class="chips-grid" id="chipsEspessura"></div>
  </div>

  <!-- CARD 3: MARKUP -->
  <div class="card" id="cardMarkup">
    <div class="card-label">3. Markup de Venda</div>
    <div class="markup-controls">
      <span class="markup-label">Percentual sobre custo c/ IPI</span>
      <div class="markup-stepper">
        <button class="markup-btn" onclick="ajustarMarkup(-5)">−</button>
        <span class="markup-val" id="markupVal">70</span>
        <span class="markup-pct">%</span>
        <button class="markup-btn" onclick="ajustarMarkup(+5)">+</button>
      </div>
    </div>
    <input type="range" class="markup-slider" id="markupSlider"
      min="10" max="200" step="1" value="70"
      oninput="setMarkup(+this.value)">
    <div class="markup-quick" id="markupQuick">
      <button class="markup-quick-btn" onclick="setMarkup(50)">50%</button>
      <button class="markup-quick-btn" onclick="setMarkup(60)">60%</button>
      <button class="markup-quick-btn active" onclick="setMarkup(70)">70%</button>
      <button class="markup-quick-btn" onclick="setMarkup(80)">80%</button>
      <button class="markup-quick-btn" onclick="setMarkup(100)">100%</button>
    </div>
    <div class="markup-formula" id="markupFormula">
      Markup atual: <strong>70%</strong> · Fórmula: PV = Custo c/ IPI × <strong>1,70</strong>
    </div>
  </div>

  <!-- BOTÃO -->
  <button class="btn-consultar" id="btnConsultar" disabled onclick="consultar()">
    🔍 Consultar Preços
  </button>

  <div id="resultado" style="display:none; margin-top:20px;"></div>
</main>

<footer>Eurovidros · Tabela Março/2026 · 176 registros</footer>

<!-- MODAL PRODUTO -->
<div class="modal-overlay" id="modalOverlay" onclick="fecharModalFora(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Selecione o Produto</div>
    <input class="modal-search" id="modalSearch" type="text" placeholder="Buscar produto ou categoria..."
      oninput="filtrarModal()" autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="modal-list" id="modalList"></div>
  </div>
</div>

/* =====================================================================

===================================================================== */
function setMarkup(v) {
  v = Math.min(200, Math.max(10, Math.round(v)));
  selMarkup = v;
  document.getElementById('markupVal').textContent = v;
  document.getElementById('markupSlider').value = v;
  const mult = (1 + v/100).toFixed(2).replace('.', ',');
  document.getElementById('markupFormula').innerHTML =
    'Markup atual: <strong>' + v + '%</strong> · Fórmula: PV = Custo c/ IPI × <strong>' + mult + '</strong>';
  // destaca botão rápido ativo
  document.querySelectorAll('.markup-quick-btn').forEach(b => {
    const bv = parseInt(b.textContent);
    b.classList.toggle('active', bv === v);
  });
  // atualiza resultado se já exibido
  if (document.getElementById('resultado').style.display !== 'none') consultar();
}

function ajustarMarkup(delta) {
  setMarkup(selMarkup + delta);
}

/* =====================================================================
   MODAL
===================================================================== */
function abrirModal() {
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('modalSearch').value = '';
  renderModalList('');
  setTimeout(() => document.getElementById('modalSearch').focus(), 300);
}

function fecharModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function fecharModalFora(e) {
  if (e.target === document.getElementById('modalOverlay')) fecharModal();
}

function filtrarModal() {
  renderModalList(document.getElementById('modalSearch').value.toLowerCase().trim());
}

function renderModalList(q) {
  const ul = document.getElementById('modalList');
  ul.innerHTML = '';

  // --- CATEGORIAS ---
  const catsFiltered = CATEGORIES.filter(c =>
    !q || c.label.toLowerCase().includes(q) || c.sub.toLowerCase().includes(q) || c.key.toLowerCase().includes(q)
  );

  if (catsFiltered.length > 0) {
    const hdr = document.createElement('div');
    hdr.className = 'modal-section-hdr';
    hdr.textContent = '📂 Consulta por Categoria';
    ul.appendChild(hdr);

    catsFiltered.forEach(cat => {
      const div = document.createElement('div');
      div.className = 'modal-category-item' + (modoCategoria && selCategoria && selCategoria.key === cat.key ? ' selected' : '');
      div.dataset.catKey = cat.key;
      div.innerHTML =
        '<span class="cat-icon">' + cat.icon + '</span>' +
        '<span class="cat-info">' +
          '<div class="cat-name">' + cat.label + '</div>' +
          '<div class="cat-sub">' + cat.sub + '</div>' +
        '</span>' +
        '<span class="cat-arrow">›</span>';
      ul.appendChild(div);
    });

    // divisor
    const div = document.createElement('hr');
    div.className = 'modal-divider';
    ul.appendChild(div);
  }

  // --- PRODUTOS INDIVIDUAIS (só aparece quando há busca ativa) ---
  if (q) {
    const prodsFiltered = PRODUCTS.filter(p => p.toLowerCase().includes(q));

    if (prodsFiltered.length > 0) {
      const hdr2 = document.createElement('div');
      hdr2.className = 'modal-section-hdr';
      hdr2.textContent = '🔍 Produto Individual';
      ul.appendChild(hdr2);

      prodsFiltered.forEach(p => {
        const item = document.createElement('div');
        item.className = 'modal-item' + (!modoCategoria && p === selProduto ? ' selected' : '');
        item.textContent = p;
        item.dataset.produto = p;
        ul.appendChild(item);
      });
    }
  }
}

// Touch/click handlers
let _touchStartY = 0, _touchMoved = false;
document.getElementById('modalList').addEventListener('touchstart', e => {
  _touchStartY = e.touches[0].clientY; _touchMoved = false;
}, {passive: true});
document.getElementById('modalList').addEventListener('touchmove', e => {
  if (Math.abs(e.touches[0].clientY - _touchStartY) > 8) _touchMoved = true;
}, {passive: true});
document.getElementById('modalList').addEventListener('touchend', e => {
  if (_touchMoved) return;
  const catItem = e.target.closest('.modal-category-item');
  const prodItem = e.target.closest('.modal-item');
  if (catItem) { e.preventDefault(); selecionarCategoria(catItem.dataset.catKey); }
  else if (prodItem) { e.preventDefault(); selecionarProduto(prodItem.dataset.produto); }
});
document.getElementById('modalList').addEventListener('click', e => {
  const catItem = e.target.closest('.modal-category-item');
  const prodItem = e.target.closest('.modal-item');
  if (catItem) selecionarCategoria(catItem.dataset.catKey);
  else if (prodItem) selecionarProduto(prodItem.dataset.produto);
});

===================================================================== */
function selecionarCategoria(key) {
  const cat = CATEGORIES.find(c => c.key === key);
  if (!cat) return;
  modoCategoria = true;
  selCategoria = cat;
  selProduto = cat.label;
  selEspessura = '';
  const btn = document.getElementById('btnProduto');
  btn.classList.add('active', 'categoria-ativa');
  document.getElementById('nomeProduto').innerHTML =
    '<span class="mode-tag">CATEGORIA</span>' + cat.icon + ' ' + cat.label;
  limparResultados();
  fecharModal();
  renderChipsCategoria(cat);
  document.getElementById('cardEspessura').style.display = 'block';
  updateBtn();
}

function selecionarProduto(p) {
  modoCategoria = false;
  selCategoria = null;
  selProduto = p;
  selEspessura = '';
  const btn = document.getElementById('btnProduto');
  btn.classList.add('active');
  btn.classList.remove('categoria-ativa');
  document.getElementById('nomeProduto').textContent = p;
  limparResultados();
  fecharModal();
  renderChipsIndividual(p);
  document.getElementById('cardEspessura').style.display = 'block';
  updateBtn();
}

function limparResultados() {
  const res = document.getElementById('resultado');
  res.style.display = 'none';
  res.innerHTML = '';
}

/* =====================================================================
   CHIPS DE ESPESSURA
===================================================================== */
function parseEspNum(e) {
  if (e.includes('+')) return e.split('+').reduce((a, b) => a + parseFloat(b), 0);
  return parseFloat(e);
}

function sortEsps(arr) {
  return [...arr].sort((a, b) => parseEspNum(a) - parseEspNum(b));
}

function renderChipsCategoria(cat) {
  const espSet = new Set();
  cat.products.forEach(p => (ESP_MAP[p] || []).forEach(e => espSet.add(e)));
  renderChips(sortEsps([...espSet]));
}

function renderChipsIndividual(produto) {
  renderChips(ESP_MAP[produto] || []);
}

function renderChips(esps) {
  const chips = document.getElementById('chipsEspessura');
  chips.innerHTML = '';
  esps.forEach(e => {
    const div = document.createElement('div');
    div.className = 'chip';
    div.textContent = e;
    div.dataset.e = e;
    chips.appendChild(div);
  });
}

document.getElementById('chipsEspessura').addEventListener('click', handleChip);
document.getElementById('chipsEspessura').addEventListener('touchend', handleChip);

function handleChip(ev) {
  const chip = ev.target.closest('.chip');
  if (!chip) return;
  ev.preventDefault();
  selEspessura = chip.dataset.e;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
  chip.classList.add('selected');
  updateBtn();
}

function updateBtn() {
  document.getElementById('btnConsultar').disabled = !(selProduto && selEspessura);
}

/* =====================================================================
   FORMATAÇÃO
===================================================================== */
function fmt(v) {
  if (v === null || v === undefined) return 'N/D';
  return 'R$ ' + v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
